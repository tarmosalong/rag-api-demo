services:
  api:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s