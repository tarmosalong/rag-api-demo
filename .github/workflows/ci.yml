name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  RAG_OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-api-demo:ci .

  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.cmd (execution policy bypass)
        shell: cmd
        run: scripts\install.cmd
      - name: pytest
        shell: pwsh
        env:
          RAG_OFFLINE: "1"
        run: .\.venv\Scripts\python.exe -m pytest -q